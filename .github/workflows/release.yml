name: release

# Manual recovery / human-pushed tags: publish a released tag to JSR.
#
# The automated release in publish.yml publishes JSR itself, because tags
# pushed with GITHUB_TOKEN do not trigger `push: tags` workflows. This workflow
# is still useful for retrying JSR (workflow_dispatch) or for tags pushed by a
# maintainer with their own credentials.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v<version> tag to publish to JSR"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  jsr:
    name: publish-to-jsr
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # `npx jsr publish` resolves npm dependencies from node_modules, so the
        # workspace must be installed before publishing @evex/linejs.
        run: pnpm install --frozen-lockfile

      - name: Verify the tag matches the package versions
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TYPES_VERSION=$(node -p "require('./packages/types/jsr.json').version")
          LINEJS_VERSION=$(node -p "require('./packages/linejs/jsr.json').version")
          if [ "$TYPES_VERSION" != "$LINEJS_VERSION" ]; then
            echo "::error::jsr.json versions differ: types=$TYPES_VERSION linejs=$LINEJS_VERSION" >&2
            exit 1
          fi
          if [ "v$TYPES_VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package version $TYPES_VERSION" >&2
            exit 1
          fi

      - name: Publish to JSR
        # Idempotent: a retry after a partial JSR publish skips versions that
        # already exist instead of failing on them.
        run: |
          set -euo pipefail

          publish_if_missing() {
            local dir="$1" package="$2" version
            version=$(node -p "require('./$dir/jsr.json').version")
            if npx --yes jsr@0.14.3 info "$package@$version" >/dev/null 2>&1; then
              echo "$package@$version is already published; skipping"
              return 0
            fi
            (cd "$dir" && npx --yes jsr@0.14.3 publish)
          }

          publish_if_missing packages/types @evex/linejs-types
          publish_if_missing packages/linejs @evex/linejs
