name: release

# JSR publishing stays tag-driven: publish.yml pushes the release tag after npm
# confirms the publish, and this workflow then publishes the same sources to JSR
# with OIDC (no long-lived tokens).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  jsr:
    name: publish-to-jsr
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The JSR CLI runs on Node and authenticates with GitHub OIDC.
      - name: Publish linejs-types to JSR
        working-directory: packages/types
        run: npx --yes jsr publish

      - name: Publish linejs to JSR
        working-directory: packages/linejs
        run: npx --yes jsr publish

      - name: Publish linejs-agent to JSR
        # The package must first be created at
        #   https://jsr.io/new?scope=evex&package=linejs-agent
        # with OIDC trust to this repository. Until then this step is expected
        # to fail; don't fail the release for it.
        continue-on-error: true
        working-directory: packages/agent
        run: npx --yes jsr publish
