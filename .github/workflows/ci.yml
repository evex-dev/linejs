name: ci
on:
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - ".vscode/**"
      - "README.md"
      - ".gitignore"
      - "LICENSE"
  push:

permissions:
  contents: read

jobs:
  test:
    name: "Build and test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Check formatting, lint, and types
        run: pnpm run check

      - name: Test packages
        run: pnpm test

      - name: Test repository scripts
        run: pnpm run test:scripts
