# autofix-ci/action requires this exact workflow name.
name: autofix.ci

on:
  # No branch filter: stacked pull requests target other pull request branches.
  pull_request:

permissions:
  contents: read

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # access-tokens keeps GitHub tarball fetches off the anonymous rate limit.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ${{ github.token }}
          nix_conf: |
            access-tokens = github.com=${{ github.token }}
            max-jobs = auto

      - name: Restore Nix store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', '**/*.nix', 'pnpm-lock.yaml') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # The pnpmDeps hash depends only on the lockfile and the Nix inputs, so
      # other pull requests skip the dependency fetch.
      - name: Detect Nix-relevant changes
        id: nix-changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --name-only |
            grep -Eq '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|flake\.lock)$|\.nix$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - parallel:
          - name: Format sources
            run: pnpm run format

          - name: Update the pnpmDeps hash and format Nix files
            env:
              NIX_CHANGED: ${{ steps.nix-changes.outputs.changed }}
            run: |
              if [ "$NIX_CHANGED" = true ]; then
                nix run .#update-pnpm-deps-hash
              fi
              nix fmt

      - name: Push fixes with autofix.ci
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          fail-fast: false
          commit-message: "chore: format and update the Nix pnpmDeps hash"
