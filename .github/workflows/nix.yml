name: Nix flake

# The flake's version check catches packages that evaluate and build but
# fail at exec time.
on:
  # No branch filter: stacked pull requests target other pull request branches.
  pull_request:
    paths:
      - "**.nix"
      - "flake.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - ".github/workflows/nix.yml"
  push:
    branches: [main]
    paths:
      - "**.nix"
      - "flake.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Nix
        uses: x-ryoppippi/setup-nix@f3480576f3ae7660b286c4ea88245925d91fb672 # v0.0.2
        with:
          extra-conf: |
            keep-derivations = true
            keep-outputs = true

      # Formatting and evaluation do not depend on the runner's platform, so
      # only Linux runs them.
      - parallel:
          - name: Check Nix formatting
            if: runner.os == 'Linux'
            run: nix fmt -- --ci

          - name: Evaluate the flake for every system
            if: runner.os == 'Linux'
            run: nix flake check --all-systems --no-build

          - name: Build the package and run the flake checks
            run: nix flake check
