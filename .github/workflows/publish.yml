name: publish

# Manual release: reads the latest published version from npm, bumps it by the
# selected semver level, publishes both packages with npm Trusted Publishing
# (OIDC provenance), publishes the same tag to JSR, then pushes the release
# commit/tag and creates the GitHub Release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver level to release"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: release and publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          npm_config_package_lock: "false"
        run: |
          set -euo pipefail

          case "$BUMP" in
            major|minor|patch) ;;
            *)
              echo "::error::Invalid bump input: $BUMP"
              exit 1
              ;;
          esac

          TYPES_NAME=$(node -p "require('./packages/types/package.json').name")
          LINEJS_NAME=$(node -p "require('./packages/linejs/package.json').name")
          TYPES_LOCAL=$(node -p "require('./packages/types/package.json').version")
          LINEJS_LOCAL=$(node -p "require('./packages/linejs/package.json').version")

          latest_version() {
            local name="$1" version err
            err=$(mktemp)
            if version=$(npm view "$name" version 2>"$err"); then
              version=$(printf '%s' "$version" | tr -d '[:space:]')
              if printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-'; then
                echo "::error::The npm latest tag for $name is a prerelease ($version); this workflow only releases stable versions." >&2
                return 1
              fi
              if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::npm returned an invalid semver for $name: $version" >&2
                cat "$err" >&2
                return 1
              fi
              printf '%s' "$version"
              return 0
            fi
            if grep -qE 'E404|404 Not Found' "$err"; then
              echo "::error::$name has no published version on npm. Publish it once manually, then configure Trusted Publishing for this repository/workflow before dispatching this workflow." >&2
            else
              echo "::error::Could not read the latest version of $name from npm:" >&2
              cat "$err" >&2
            fi
            return 1
          }

          TYPES_LATEST=$(latest_version "$TYPES_NAME")
          LINEJS_LATEST=$(latest_version "$LINEJS_NAME")

          # Never downgrade: the release base is the newest of both registry
          # versions and the two checked-in versions, so recovery from a partial
          # release or a manual bump stays possible.
          BASE_VERSION=$(node -e '
            const versions = process.argv.slice(1).filter((version) => /^\d+\.\d+\.\d+$/.test(version));
            const parse = (version) => version.split(".").map(Number);
            let best = parse(versions[0]);
            for (const version of versions.slice(1)) {
              const parts = parse(version);
              for (let index = 0; index < 3; index += 1) {
                if (parts[index] !== best[index]) {
                  if (parts[index] > best[index]) best = parts;
                  break;
                }
              }
            }
            console.log(best.join("."));
          ' "$TYPES_LATEST" "$LINEJS_LATEST" "$TYPES_LOCAL" "$LINEJS_LOCAL")

          VERSION=$(node -e '
            const bump = process.argv[2];
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const next = bump === "major"
              ? [major + 1, 0, 0]
              : bump === "minor"
                ? [major, minor + 1, 0]
                : [major, minor, patch + 1];
            console.log(next.join("."));
          ' "$BASE_VERSION" "$BUMP")

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Computed an invalid version: $VERSION" >&2
            exit 1
          fi
          if [ "$VERSION" = "$TYPES_LATEST" ] || [ "$VERSION" = "$LINEJS_LATEST" ]; then
            echo "::error::Computed version $VERSION is already published" >&2
            exit 1
          fi

          (cd packages/types && npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null)
          (cd packages/linejs && npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null)

          # Keep JSR metadata in lockstep with package.json. JSR publishing
          # runs in this workflow after the tag is pushed.
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            for (const file of [
              "packages/types/jsr.json",
              "packages/linejs/jsr.json",
              "packages/agent/jsr.json",
            ]) {
              const config = JSON.parse(fs.readFileSync(file, "utf8"));
              config.version = version;
              if (config.imports?.["@evex-dev/linejs-types"]) {
                config.imports["@evex-dev/linejs-types"] = `npm:@evex-dev/linejs-types@^${version}`;
              }
              fs.writeFileSync(file, `${JSON.stringify(config, null, "\t")}\n`);
            }
          '

          # pnpm publish cannot fall back to the npm registry for a workspace
          # dependency, so pin the concrete range the release publishes.
          (cd packages/linejs && npm pkg set "dependencies.@evex-dev/linejs-types=^$VERSION")

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "types_name=$TYPES_NAME" >> "$GITHUB_OUTPUT"
          echo "linejs_name=$LINEJS_NAME" >> "$GITHUB_OUTPUT"

      - name: Sync the lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format the bumped manifests
        # `npm version`/`npm pkg set` may rewrite JSON indentation; keep the
        # format check in prepublishOnly green.
        run: pnpm run format

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm run build
          pnpm test
          pnpm run test:scripts
          pnpm run check

      - name: Refuse to reuse an existing version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          TYPES_NAME: ${{ steps.version.outputs.types_name }}
          LINEJS_NAME: ${{ steps.version.outputs.linejs_name }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists" >&2
            exit 1
          fi
          for name in "$TYPES_NAME" "$LINEJS_NAME"; do
            err=$(mktemp)
            if npm view "$name@$VERSION" version >/dev/null 2>"$err"; then
              echo "::error::$name@$VERSION is already published" >&2
              exit 1
            fi
            if ! grep -qE 'E404|404 Not Found' "$err"; then
              echo "::error::Could not check whether $name@$VERSION exists on npm:" >&2
              cat "$err" >&2
              exit 1
            fi
          done

      - name: Ensure main has not moved
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::origin/main moved during the release. Re-run the workflow from the new main." >&2
            exit 1
          fi

      - name: Create the release commit and tag locally
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"

      - name: Publish to npm with Trusted Publishing
        # pnpm rewrites package.json with the `publishConfig` exports/main/types
        # (dist) before packing, and exchanges the GitHub OIDC token itself.
        run: |
          set -euo pipefail
          (cd packages/types && pnpm publish --access public --no-git-checks)
          (cd packages/linejs && pnpm publish --access public --no-git-checks)

      - name: Push the release commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push --atomic origin HEAD:main "$TAG"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"

      - name: Publish to JSR
        # Runs here because tags pushed with GITHUB_TOKEN do not trigger
        # release.yml. The tag is already public at this point, so a JSR
        # failure can be retried from the Actions tab.
        run: |
          set -euo pipefail
          (cd packages/types && npx --yes jsr@0.14.3 publish)
          (cd packages/linejs && npx --yes jsr@0.14.3 publish)
          (cd packages/agent && npx --yes jsr@0.14.3 publish)
